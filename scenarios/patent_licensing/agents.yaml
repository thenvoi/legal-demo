# Framework and model configuration for the patent licensing scenario agents.
#
# The defaults below mix langgraph and pydantic_ai on OpenAI models
# (gpt-5.4-mini), which means you need OPENAI_API_KEY set in your .env.
#
# Supported frameworks: anthropic, pydantic_ai, langgraph, crewai, letta,
# parlant. Swap any agent's `framework:` and `model:` to one of these and the
# rest of the demo keeps working:
#
#   # Claude models (set ANTHROPIC_API_KEY in your .env)
#   framework: pydantic_ai
#   model: claude-sonnet-4-6
#
#   # A local model through any OpenAI-compatible endpoint (Ollama, vLLM,
#   # LM Studio, etc.). Set OPENAI_BASE_URL in your .env to the server URL,
#   # e.g. http://localhost:11434/v1, and use whatever model name your
#   # server exposes.
#   framework: langgraph
#   model: llama3.1:8b
#
# Any key beyond `framework:` and `model:` is forwarded straight into the
# adapter constructor, so adapter-specific options (reasoning_effort,
# max_thinking_tokens, temperature, ...) live here in yaml.

tv_contract_attorney:
  framework: langgraph
  model: gpt-5.4-mini

tv_ip_analyst:
  framework: pydantic_ai
  model: gpt-5.4-mini

bg_licensing_counsel:
  framework: pydantic_ai
  model: gpt-5.4-mini

bg_regulatory_advisor:
  framework: pydantic_ai
  model: gpt-5.4-mini
